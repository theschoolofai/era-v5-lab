# Gate 2 decision, 14 Nov 2026.
# Muon, v0 attention, 16 routed experts plus 1 shared, top-2.
# optim.lr stays 1e-3 and stays provisional.
# Model sizes and embedding.ke2_output_dim stay empty.
# The reasons are in decisions.md.
settings:
  - key: run.seed
    value: 1234
    source: "G5 week-1 gate, 24 Oct 2026. Two runs with this seed must match."
  - key: run.grad_clip
    value: 1.0
    source: "The harness sets the clip. DeepSpeed clips at 1.0 by default and plain DDP does not."
  - key: optim.name
    value: muon
    source: "Gate 2, 14 Nov 2026. The optimizer is Muon. A separate Muon matrix rate was not named, so muon_lr is not set in this file."
  - key: optim.lr
    value: 0.001
    open: true
    source: "Gate 2, 14 Nov 2026. The learning rate 1e-3 stays provisional. The T1 table still stands: lowest whole-file val/bpb on all three seeds, smallest spread, mean 1.9686, SD 0.0070, for 245-step T1 runs. Three-group, code, and Indic values were not measured."
  - key: tokenizer.name
    value: BrahmicTokenizer-131K
    source: "G3 week-1 note. BrahmicTokenizer-131K is tokenizer v0. The file arrives 28 Oct."
  - key: tokenizer.vocab_size
    value: 131072
