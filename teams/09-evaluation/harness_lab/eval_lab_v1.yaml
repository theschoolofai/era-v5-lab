# eval-mini on lab checkpoints, v1.
# Freeze set = the guard of results/config_freeze_proposal.md (PR #357, decisions 1-3, accepted by TSAI on 12 Nov 2026).
# Diagnostics = decision 4 (TSAI, comment on #357): allowed on lab checkpoints, every number labelled with `labels.diagnostic`,
# they never pick or block a candidate. Items and seeds are the ones eval-mini already uses, so lab scores can be read next
# to the public-model scores in results/eval_mini_v1.json.
version: eval_lab_v1

labels:
  diagnostic: "diagnostic, not cleared for contamination"
  freeze: "freeze set (guard)"

spec:
  path: harness_code_indic/eval_mini_v0_spec.json          # relative to teams/09-evaluation
  sha256: 94de47d2334eff1d5419aad73c355c91abe16d278c9f45c9e2a4acf9ef3d399a   # item_set of the spec records in eval_mini_v1.json

groups:
  # harness/run_eval_mini.py, profile "mini": lm-eval takes the first N items; one seed (42) for all four generators.
  - name: mini
    profile: mini
    items: limit
    seed: {random: 42, numpy: 42, torch: 42, fewshot: 42}
    tasks:
      - {task: mmlu, num_fewshot: 0, limit: 10, role: freeze, primary: acc}          # 10 per subject x 57 = 570
      - {task: arc_challenge, num_fewshot: 0, limit: 500, role: diagnostic, primary: acc_norm}
      - {task: hellaswag, num_fewshot: 0, limit: 400, role: diagnostic, primary: acc_norm}

  # harness_code_indic/run_lm_eval.py with the eval-mini spec: the listed doc ids; lm-eval 0.4.13 default seeds.
  - name: code_indic
    profile: code_indic
    items: spec
    seed: {random: 0, numpy: 1234, torch: 1234, fewshot: 1234}
    tasks:
      - {task: milu_Hindi, num_fewshot: 5, role: freeze, primary: acc}
      - {task: milu_Telugu, num_fewshot: 5, role: freeze, primary: acc}
      - {task: milu_Tamil, num_fewshot: 5, role: freeze, primary: acc}
      - {task: milu_Bengali, num_fewshot: 5, role: freeze, primary: acc}
      - {task: leaderboard_mmlu_pro, num_fewshot: 5, role: diagnostic, primary: acc}
      - {task: belebele_hin_Deva, num_fewshot: 5, role: diagnostic, primary: acc}
      - {task: belebele_tel_Telu, num_fewshot: 5, role: diagnostic, primary: acc}
      - {task: belebele_tam_Taml, num_fewshot: 5, role: diagnostic, primary: acc}

# Decision 3 of the proposal. Part (b) also needs the experiment's baseline run, so the verdict is written in
# results/eval_mini_lab_ckpts.md; out/guard.json gives the numbers.
guard:
  chance: 25.0
  pooled_floor: 22.2            # 25 - 2 x sqrt(0.25 x 0.75 / 970) x 100
  baseline_gap: 3.9             # 2 x sqrt(2) x 1.39
  expected_items: {mmlu: 570, milu_Hindi: 100, milu_Telugu: 100, milu_Tamil: 100, milu_Bengali: 100}
