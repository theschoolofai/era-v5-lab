# G9 benchmark registry: which benchmark items go into the fingerprints.
#
# Rows follow teams/09-evaluation/benchmarks/benchmarks_v1.md, plus GSM8K,
# FLORES-200 and IN22 (team decision, 25 Oct). Licences are as in benchmarks_v1.md.
# status = "active"  : built into the fingerprint set.
#          "planned" : not built yet. 'reason' says what is missing.
#          "skip"    : nothing to fingerprint. 'reason' says why.
#
# Keys of an active benchmark:
#   source    "hf" (repo + revision), "url" (url per file) or "local" (path per file)
#   files     list of {path, sha256}; format from the extension: parquet, jsonl, json, csv
#   split     label in the item reference <id>:<split>:<item>
#   id        template for the item id (default: row number)
#   dedupe    true: skip a row whose id came before (the same item in two splits)
#   texts     prose templates of the text forms to fingerprint. "{field|filter}"; filters in
#             registry.py: lines, lettered, no_calc, diff_added, guid
#   code      code templates (run length n_code, default 20 tokens)
#   mixed     prose with pasted code, for example a GitHub issue. Split into prose and code.
#   canaries  templates of canary strings in the rows. One exact match flags a document.
#   tags      for decontam_check.py --tags (for example code, indic)
#   n         words per prose run (default 13). n_code: tokens per code run (default 20)
#   gated     true if Hugging Face needs accepted terms and a token
#
# Fingerprint only the parts that are unique to the benchmark (questions, choices, answers,
# solutions), not shared context such as long documents or repository code.

# ---------------------------------------------------------------- general knowledge

[mmlu]
name = "MMLU"
status = "active"
tags = ["english", "knowledge"]
licence = "MIT"
source = "hf"
repo = "cais/mmlu"
revision = "c30699e8356da336a370243923dbaf21066bb9fe"
