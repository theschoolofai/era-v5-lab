# Laptop smoke test (CPU): smoke_tiny_olmoe.yaml with rollouts from an int8 copy of the policy and objective_v1, whose
# trust region masks tokens where learner and rollout copy disagree. The router is never quantized or trained.
# Proves the quantized-rollout path runs and learns on a toy task; says nothing about speed or a real model.
seed: 1
device: cpu
out_dir: out/smoke_tiny_olmoe_quant
model:
  kind: tiny_olmoe
  config: {vocab_size: 16, hidden_size: 32, intermediate_size: 32, num_hidden_layers: 2, num_attention_heads: 4,
           num_key_value_heads: 4, num_experts: 4, num_experts_per_tok: 2, max_position_embeddings: 64}
task: {kind: toy, vocab: 16, prompt_len: 4, offset: 3, n_train: 256, n_heldout: 64}
train:
  algo: objective_v1
  steps: 80
  prompts_per_step: 16
  k: 8
  max_new: 2
  temperature: 1.0
  lr: 0.01
  ppo_epochs: 1
  kl_coef: 0.0
  eval_every: 20
  eval_k: 8
  sampler: quant
  # No max_k3 stop here: on a 16-token toy a single step's gap can spike. A real run sets it (max_k3: 0.05 is the
  # limit Team 12 used to accept a quantized export).
  quant: {scheme: int8_dynamic, guard: true}
