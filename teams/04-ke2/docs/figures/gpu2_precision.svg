<svg xmlns="http://www.w3.org/2000/svg" width="880" height="472" viewBox="0 0 880 472" role="img" aria-label="Score precision against batch size">
<title>Score precision against batch size</title>
<style>
.bg{fill:#fcfcfb}.card{fill:#fcfcfb;stroke:#0b0b0b;stroke-opacity:.12}
.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#898781}
.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.ref{stroke:#52514e}
.s1{stroke:#2a78d6}.f1{fill:#2a78d6}.s2{stroke:#eb6834}.f2{fill:#eb6834}.s3{stroke:#1baf7a}.f3{fill:#1baf7a}
.ok{fill:#0ca30c}.bad{fill:#d03b3b}.band{fill:#0b0b0b;fill-opacity:.04}.ring{stroke:#fcfcfb}.icon{stroke:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.card{fill:#1a1a19;stroke:#ffffff;stroke-opacity:.14}
.t1{fill:#f0efec}.t2{fill:#c3c2b7}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}.ref{stroke:#c3c2b7}
.s1{stroke:#3987e5}.f1{fill:#3987e5}.s2{stroke:#d95926}.f2{fill:#d95926}.s3{stroke:#199e70}.f3{fill:#199e70}
.band{fill:#ffffff;fill-opacity:.06}.ring{stroke:#1a1a19}
}
</style>
<rect width="880" height="472" rx="10" class="bg"/>
<text x="24.0" y="34.0" class="t1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" text-anchor="start">fp32 error grows with batch size; the worst margin error is still 39× smaller than the smallest margin</text>
<text x="24.0" y="56.0" class="t2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start">Largest absolute error against float64, log scale. An ID can change only if an error reaches the dashed line.</text>
