<svg xmlns="http://www.w3.org/2000/svg" width="880" height="358" viewBox="0 0 880 358" role="img" aria-label="Decode time per batch size">
<title>Decode time per batch size</title>
<style>
.bg{fill:#fcfcfb}.card{fill:#fcfcfb;stroke:#0b0b0b;stroke-opacity:.12}
.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#898781}
.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.ref{stroke:#52514e}
.s1{stroke:#2a78d6}.f1{fill:#2a78d6}.s2{stroke:#eb6834}.f2{fill:#eb6834}.s3{stroke:#1baf7a}.f3{fill:#1baf7a}
.ok{fill:#0ca30c}.bad{fill:#d03b3b}.band{fill:#0b0b0b;fill-opacity:.04}.ring{stroke:#fcfcfb}.icon{stroke:#ffffff}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.card{fill:#1a1a19;stroke:#ffffff;stroke-opacity:.14}
.t1{fill:#f0efec}.t2{fill:#c3c2b7}
.grid{stroke:#2c2c2a}.axis{stroke:#383835}.ref{stroke:#c3c2b7}
.s1{stroke:#3987e5}.f1{fill:#3987e5}.s2{stroke:#d95926}.f2{fill:#d95926}.s3{stroke:#199e70}.f3{fill:#199e70}
.band{fill:#ffffff;fill-opacity:.06}.ring{stroke:#1a1a19}
}
</style>
<rect width="880" height="358" rx="10" class="bg"/>
<text x="24.0" y="34.0" class="t1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" text-anchor="start">Time to decode all token IDs once, by batch size</text>
<text x="24.0" y="56.0" class="t2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start">Mean of 3 fresh GPU processes; codec + cosine against all codes + decision. Candidate encoding (under 1 s) excluded.</text>
<text x="108.0" y="109.0" class="t1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="end">batch 1</text>
<g><title>batch 1: 1512.9 s per pass (runs: 1484.961, 1454.034, 1599.591)</title><path d="M120,94 h596.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-596.0 z" class="f1"/></g>
<text x="728.0" y="109.0" class="t1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="start">25.2 min per pass</text>
<text x="120.0" y="136.0" class="t2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="start">11.5 ms per batch; reads all 4 GiB of codes each batch: 372 GB/s (memory-bound)</text>
<text x="108.0" y="183.0" class="t1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="end">batch 7</text>
