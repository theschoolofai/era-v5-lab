<text x="216.8" y="183.0" class="t1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="start">3.7 min per pass</text>
<text x="120.0" y="210.0" class="t2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="start">12.0 ms per batch; reads all 4 GiB of codes each batch: 359 GB/s (memory-bound)</text>
<text x="108.0" y="257.0" class="t1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="end">batch 4,096</text>
<g><title>batch 4,096: 24.5 s per pass (runs: 24.419, 24.668, 24.56)</title><path d="M120,242 h5.7 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-5.7 z" class="f1"/></g>
<text x="137.7" y="257.0" class="t1" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="start">25 s per pass</text>
<text x="120.0" y="284.0" class="t2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="start">767 ms per batch; 11.5 TFLOP/s fp32 (compute-bound)</text>
