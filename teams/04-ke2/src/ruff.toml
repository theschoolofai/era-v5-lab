# Lint and format settings for teams/04-ke2 (src/ and tests/; tests/ruff.toml extends this file).
line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are left to the formatter
    "RUF001",  # Unicode in strings is intended (Indic text, U+FFFD)
    "RUF002",
    "RUF003",
]

[lint.isort]
known-first-party = ["ke2", "decode_ref", "build_tables", "forward", "proof_checks", "codec_v1_cpu_mps", "tokenizer_decode_cpu", "run_experiment"]
