# Draft metric list for G8 monitoring. Each metric has a name, unit, cadence (how often it is collected), source and notes.
# Values from the G5 training script (train.py) are checked against its code. Everything else is a proposal.
# Cadences are proposals too. They are separate from the logger, which writes to storage every 10 steps.
# G6 metrics are described in teams/06-performance/docs/METRICS.md. Today G6 writes them as a summary after each
# benchmark run. G8 has asked for per-GPU records it can read during the run; waiting for G6 to confirm.
# Unit "nats": average loss per predicted token, using the natural log. Lower is better.
# Other data loader metrics (cache, shard reads, packing), recovery and multi-GPU communication metrics are
# left out until something produces them.
# train.py also writes a field called loss. It is a copy of loss_ntp, so it is left out of this list and should not
# be counted as a separate loss.

metrics:
# --- Written by the G5 training script today ---
# Is the model learning to predict the next token?
- name: loss_ntp
  unit: nats
  cadence: Every training step
  source: G5 train.py, one row per step in metrics.jsonl.
  notes: Loss for predicting the next token, averaged over the positions that have a next token. The model trains on
    loss_ntp + loss_mtp, so this is only part of the training loss. To confirm for real runs - masking and
    combining values across GPUs.
# The other part of the training loss. Without it, a broken second head would go unnoticed.
- name: loss_mtp
  unit: nats
  cadence: Every training step
  source: G5 train.py, one row per step in metrics.jsonl.
  notes: Loss for predicting the token two positions ahead, from a second output head. No field holds the total
    loss_ntp + loss_mtp. The second head is always on in train.py. To confirm - what happens when it is off.
# Helps explain changes in the loss and check that the learning-rate schedule ran as planned.
- name: lr
  unit: dimensionless
  cadence: Every training step
  source: G5 train.py, one row per step in metrics.jsonl.
  notes: Learning rate for the step. train.py has no schedule, so it writes the same configured value every step.
    Later versions should log the value the optimizer actually used.
# Training speed. A drop can reveal a slowdown even when the loss looks fine.
- name: tokens_per_second
  unit: tokens_per_second
  cadence: Every training step
  source: G5 train.py, one row per step in metrics.jsonl.
  notes: All input tokens in the batch divided by the step time. The timer covers the GPU work of the step, not
    loading the batch or writing the log row. Step 0 is slower because of one-time setup. To confirm for real
    runs - padding and counting across GPUs.
# Memory PyTorch is using (weights, gradients, optimizer state). A steady rise may point to a leak or a coming
# out-of-memory crash.
- name: gpu_alloc_gb
  unit: GiB
  cadence: Every training step
  source: G5 train.py, one row per step in metrics.jsonl.
  notes: Memory PyTorch has allocated after the step. The name says gb, but the value is GiB (divided by 1024^3).
    Name kept to match train.py. Does not include memory PyTorch has reserved or other processes are using
    (see gpu_memory_used). 0.0 when running on CPU.

# --- Training health; proposed, waiting for G5 to confirm ---
# Early warning of unstable training. It often spikes before the loss does.
- name: gradient_norm
  unit: gradient_units
  cadence: Every training step
  source: G5 train.py, one row per step in metrics.jsonl. The value that clip_grad_norm_ returns.
  notes: Size of all gradients combined, before clipping. To confirm for real runs - combining across GPUs.
# Clipping on most steps is worth checking. The threshold may be wrong or training may be unstable.
- name: gradient_clipping_applied
  unit: boolean
  cadence: Every training step
  source: Not written yet. Proposed for G5 to work out from gradient_norm and the clipping threshold
    (run.grad_clip).
  notes: True when gradient_norm is above the threshold and the gradients were scaled down.
# How big each update is compared with the weights. Very large may mean unstable training; very small may mean
# learning has stalled.
- name: update_weight_ratio
  unit: dimensionless
  cadence: Every N training steps (N to be agreed)
  source: Not written yet. Proposed for G5 to add around the optimizer step in train.py.
  notes: Proposed formula is L2 norm of (weights after - weights before) / L2 norm of weights before. A copy of
    the weights is needed only on the steps being measured. To agree - one value for the whole model or one per
    layer, and what to do when the weights are zero.
# Are the experts sharing the work? A few experts getting most of the routing may mean routing has collapsed.
- name: expert_load
  unit: fraction
  cadence: Every training step
  source: Not written yet. Proposed for G5 to count which experts the router picks in train.py.
  notes: Each token picks top-k experts. Proposed value is each expert's share of all these picks (tokens x k), so
    the shares add up to 1 for each expert layer. This is a list of values, not one number. To agree - this
    definition, and a single summary number for alarms, such as busiest expert / average expert.
# The main check in this list that the model improves on data it has not trained on. Helps spot overfitting.
- name: validation_loss
  unit: nats
  cadence: Each validation run
  source: G5 evaluation script; not written by train.py.
  notes: Loss on a fixed validation dataset for a given checkpoint. To confirm with G5 - who produces it, how it
    is calculated and how often it runs.

# --- System metrics; G6 to supply ---
# Are the GPUs busy? Low values may mean GPU time is being wasted.
- name: gpu_utilization
  unit: percent
  cadence: G6 samples every 1 second; G8 rolls up into 10-second windows (mean and min)
  source: G6 GpuSampler field gpu_util_pct (nvidia-smi utilization.gpu).
  notes: Percentage of time at least one GPU kernel was running. This is not how fully the GPU is used, so one
    small kernel at a time can still show 100%.
# Total memory used on the GPU, including what PyTorch does not count. Closer to what triggers out-of-memory
# crashes than gpu_alloc_gb.
- name: gpu_memory_used
  unit: bytes
  cadence: G6 samples every 1 second; G8 rolls up into 10-second windows (max)
  source: G6 GpuSampler field mem_used_mib (nvidia-smi memory.used). G6 sends MiB; G8 converts to bytes
    (x 1,048,576).
  notes: Memory used on the whole GPU by all processes, not only PyTorch. Stored in bytes, while gpu_alloc_gb
    is in GiB, so convert before comparing them.
# GPU heat. A hot GPU lowers its clocks (thermal slowdown), so steps get slower with no change in code or data.
- name: gpu_temp_c
  unit: degrees C
  cadence: Every training step (per-step logger); 1 second in the GPU telemetry (gpu_telemetry_1s)
  source: metrics_logger/gpu_thermal.py, NVML nvmlDeviceGetTemperature (NVML_TEMPERATURE_GPU) for the rank's own
    GPU (LOCAL_RANK). Written nothing on a machine without an NVIDIA GPU. The writer also takes temp_c, the name
    of G6's sampler field, and stores it as gpu_temp_c.
  notes: GPU core temperature. Dashboard colours (panel 22) - green below 75, yellow from 75, red from 85.
    The per-step value is one GPU (the writer runs on rank 0); every GPU is in gpu_telemetry_1s.
- name: gpu_thermal_throttle
  unit: 0 or 1
  cadence: Every training step, with gpu_temp_c
  source: metrics_logger/gpu_thermal.py, NVML clock throttle (clocks event) reasons of the same GPU.
  notes: 1 when HW thermal slowdown (0x40) or SW thermal slowdown (0x20) is set, else 0. Other reasons (power
    cap, idle, application clocks) do not count. A 1 next to slower steps means heat, not the code.
# Model FLOPs utilization (MFU): how much of the GPUs' peak compute is actually used. G6 owns the method.
- name: model_flops_utilization
  unit: fraction
  cadence: One value per G6 benchmark run today (from the median step time)
  source: G6 run JSON field metrics.mfu. G8 uses this value as is and does not recalculate it.
  notes: G6 formula is tokens per second x model FLOPs per token / peak FLOPs per second for the run's dtype.
    Model FLOPs per token counts only the chosen experts. null means the peak is unknown; treat it as missing,
    not 0. To confirm with G6 - whether it works for G5's train.py (which runs every expert), whether it covers
    one GPU or the whole run, and the field that gives the reason when it is null.

# --- Data ---
# Tells a slow data loader apart from slow GPU work.
- name: loader_wait_time
  unit: seconds
  cadence: Every training step
  source: Proposed - G6 field data_ms (milliseconds; G8 converts to seconds). Not written by G5's train.py.
  notes: Time the training loop waits for the next batch. G6's data_ms times only the host-side next_batch() call,
    and today it is a run summary, not one value per step. To confirm with G6 - that this is the right boundary,
    and adding per-step values.
# Data and tokenizer health. A rise means the tokenizer splits the batch's text into more tokens per byte, for
# example a new language mix, a tokenizer swap, or text the normalizer did not expect.
- name: tokens_per_byte
  unit: tokens_per_byte
  cadence: Every training step
  source: G5 train_week2.py logs train/scored_tokens and train/utf8_bytes each step; the Grafana panel divides
    them. A trainer that calls metrics_logger/tokens_per_byte.py logs tokens_per_byte directly.
  notes: Scored (non-padding) tokens in the step's batch divided by the UTF-8 bytes they encode. Lower means
    fewer tokens per byte. Summed over micro-batches and ranks before dividing. Reference for checking - G3's
    harness measures the same tokenizer on held-out text (teams/03-tokenizer/COMPARE.md).
- name: tokens_per_byte_by_lang
  unit: tokens_per_byte
  cadence: Every training step, when batch rows carry a language tag
  source: metrics_logger/tokens_per_byte.py, given one G5 slice tag per row (DocumentWindows.window_slices).
    Stored in metrics_raw as tokens_per_byte_by_lang.<slice>.
  notes: The same ratio for each slice (en, code, math, sci, hi, bn, ta, te, kn, ml, mr, gu, pa, or, as). A slice
    absent from a batch writes nothing that step. To confirm with G5 - tagging training rows (today only the
    held-out set is built with sources_path).
