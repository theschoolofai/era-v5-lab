<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">The 1% sample report</title>
<desc id="d">Seconds per stage on the 1% slice of sample v0, baseline run with MinHash overlap against the hash-only run of B3, at commit 2d09b023: clean 10.1 and 12.0, overlap 18.5 and 0.9, F2 35.5 and 34.6, shards 151.6 and 146.8, the other stages 2.8 and 2.7. Totals 218.5 and 197.0 seconds. Both runs read 14,450 rows and kept 14,092; 108 of 108 checks; the 48 shards are byte-identical.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em}
.h1{font-size:24px;font-weight:600}
.sub{font-size:14.5px}
.b{font-weight:600}
.bg{fill:#ffffff;stroke:#d1d9e0}.edge{stroke:#d1d9e0}.ink{fill:#1f2328}.mute{fill:#59636e}.faint{fill:#818b98}.teal-c{fill:#e1f5f0;stroke:#0f7b6c}.gray-c{fill:#eef1f4;stroke:#6e7781}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#30363d}.edge{stroke:#30363d}.ink{fill:#e6edf3}.mute{fill:#9198a1}.faint{fill:#6e7681}.teal-c{fill:#0d2a26;stroke:#3cc2a8}.gray-c{fill:#1c2128;stroke:#8b949e}}
</style>
<rect class="bg" x=".5" y=".5" width="1199" height="519" rx="14"/>
