<text x="40" y="82" class="h1 ink">The exact-hash overlap takes 0.9 s where MinHash takes 18.5 s</text>
<text x="40" y="108" class="sub mute">All 86 parts of sample v0, 14,450 rows, the whole pipeline without H3, at 2d09b023 on an Apple M4 (10 cores, 16 GiB).</text>
<text x="40" y="128" class="sub mute">Both runs: the same rows at every stage, 108 of 108 checks, the 48 shard files byte-identical.</text>
