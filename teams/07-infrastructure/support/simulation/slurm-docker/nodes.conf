# Docker test nodes. c1-c3 stand in for GPU nodes, c4 for the eval/cpu node.
# Each "GPU" node declares 2 counted GPUs (no devices), so GPU allocation and GPU-hour accounting are
# tested. On EC2 (nodes.ec2.conf) the nodes carry Gres=gpu:b200:8 and Feature=efa.
NodeName=c[1-3] CPUs=4 RealMemory=1500 Gres=gpu:2 State=UNKNOWN
NodeName=c4 CPUs=4 RealMemory=1500 State=UNKNOWN
# DefaultTime: a job without --time gets it. Without it Slurm uses the QOS MaxWall (24 h), above these
# partitions' MaxTime, and the job pends forever (PartitionTimeLimit; found in run 15). gpu keeps none: team
# jobs there get the QOS MaxWall, the main run no limit.
PartitionName=gpu   Nodes=c[1-3] Default=YES MaxTime=INFINITE OverSubscribe=EXCLUSIVE State=UP
PartitionName=eval  Nodes=c4 MaxTime=04:00:00 DefaultTime=01:00:00 State=UP
PartitionName=debug Nodes=c[1-4] MaxTime=00:30:00 DefaultTime=00:10:00 State=UP
PartitionName=cpu   Nodes=c4 MaxTime=1-00:00:00 DefaultTime=01:00:00 State=UP
