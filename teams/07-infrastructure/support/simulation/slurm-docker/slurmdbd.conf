# Accounting daemon for the Docker test. The password is a test-only value for a local container;
# on cloud nodes the database password comes from the cloud secrets store, never from git.
AuthType=auth/munge
DbdHost=slurmdbd
SlurmUser=slurm
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/run/slurmdbd.pid
StorageType=accounting_storage/mysql
StorageHost=mariadb
StorageUser=slurm
StoragePass=simonly
StorageLoc=slurm_acct_db
