# EC2 nodes (ADR 0002 §1). Not used by the Docker test. Counts are placeholders until the GPU count is
# decided. State=CLOUD lets Slurm start and stop the instances, so idle nodes do not cost money.
# The hot spare: `job_queue.py keep-spare` (a systemd timer on the controller, every minute) sets
# SuspendExcNodes to the one spare node by NAME and powers a node up if none is free. We do not use the
# `gpu-[1-9]:1` count form: the slurm.conf page says it keeps N "powered up" nodes, and does not say whether
# a busy main-run node counts. If it did, no spare would be kept. Naming the node leaves no doubt.
# KeepPowerSaveSettings: an `scontrol reconfigure` must not reset the spare that keep-spare named.
# The ec2_suspend.sh / ec2_resume.sh scripts are week-2 work (they need the AWS account).
SuspendProgram=/opt/v5/slurm/ec2_suspend.sh
ResumeProgram=/opt/v5/slurm/ec2_resume.sh
SuspendTime=600
SuspendExcNodes=gpu-9
ReconfigFlags=KeepPowerSaveSettings
ResumeTimeout=900
NodeName=gpu-[1-9] CPUs=192 RealMemory=2000000 Gres=gpu:b200:8 Feature=efa State=CLOUD
NodeName=eval-[1-2] CPUs=48 RealMemory=380000 Gres=gpu:l40s:4 State=CLOUD
NodeName=cpu-[1-4] CPUs=64 RealMemory=250000 State=CLOUD
# DefaultTime: a job without --time gets it. Without it Slurm uses the QOS MaxWall (24 h), above these
# partitions' MaxTime, and the job pends forever (PartitionTimeLimit; found in run 15). gpu keeps none: team
# jobs there get the QOS MaxWall, the main run no limit.
PartitionName=gpu   Nodes=gpu-[1-9] Default=YES MaxTime=INFINITE OverSubscribe=EXCLUSIVE State=UP
PartitionName=eval  Nodes=eval-[1-2] MaxTime=04:00:00 DefaultTime=01:00:00 State=UP
PartitionName=debug Nodes=gpu-[1-9] MaxTime=00:30:00 DefaultTime=00:10:00 State=UP
PartitionName=cpu   Nodes=cpu-[1-4] MaxTime=1-00:00:00 DefaultTime=01:00:00 State=UP
