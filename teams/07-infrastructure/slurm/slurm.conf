# V5 Slurm configuration (ADR 0002). The same file runs in the Docker test and on cloud nodes.
# Only the node and partition lines differ; they live in nodes.conf (Docker) or nodes.cloud.conf (the cloud).
ClusterName=v5sim
# Primary and backup controller (ADR 0002 §1). They share StateSaveLocation (shared file system on cloud nodes, a volume in Docker).
SlurmctldHost=slurmctld
SlurmctldHost=slurmctld2
SlurmUser=slurm
AuthType=auth/munge
# A requeued job waits cred_expire + 1 s before it may start again (default 120 s), so the old job's launch
# credential has expired on every node. Starting it sooner gets it killed ("Job credential revoked") and
# FAILED instead of requeued: found in the Docker simulation, run 7. The credential must also outlive the
# prolog (slurm.conf man page: "long enough to ... run prolog"), and our prolog budget is 30 s
# (health/thresholds.yaml). 60 s = twice that budget: a slow node's prolog cannot expire the credential.
# Price: about 30 s more per restart than cred_expire=30 (review finding, week 1).
AuthInfo=cred_expire=60
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldTimeout=60
# A node that stops answering for 30 s is marked down and its jobs are requeued (node-loss drill).
SlurmdTimeout=30
ReturnToService=1

SlurmdParameters=config_overrides
# GPUs are a counted resource (gres): a job asks --gpus-per-node and gets exactly those devices.
GresTypes=gpu

SchedulerType=sched/backfill
# nohold_on_prolog_fail: a job whose prolog finds a sick node goes back to the queue, not to "held".
SchedulerParameters=nohold_on_prolog_fail
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

# --- Accounting, fair-share, budgets (ADR 0002 §4) ---
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
# safe: a job starts only if it can finish inside its account's GPU-hour budget (GrpTRESMins), so the
# budget is a hard stop, not "stop after the job that overspent it" (uz9ai's queue design, team 07; run 15).
AccountingStorageEnforce=associations,limits,qos,safe
# Record GPU use per job and account, so budgets and reports are in GPU-hours, not CPU-hours.
AccountingStorageTRES=gres/gpu
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30
PriorityType=priority/multifactor
PriorityWeightQOS=100000
PriorityWeightFairshare=10000
PriorityWeightAge=100
PriorityDecayHalfLife=7-0
PriorityCalcPeriod=1

# --- Preemption: the main run takes GPUs from team jobs, which go back to the queue (ADR 0002 §4) ---
PreemptType=preempt/qos
PreemptMode=REQUEUE

# --- Restart contract (ADR 0001 §6, ADR 0002 §5) ---
# Exit 75 = "I saved, run me again" -> requeue. Exit 78 = "do not retry" -> hold for a human.
JobRequeue=1
RequeueExit=75
RequeueExitHold=78
MaxBatchRequeue=1000
KillWait=30

# --- Health (ADR 0003) ---
HealthCheckProgram=/opt/v5/slurm/healthcheck.sh
HealthCheckInterval=30
HealthCheckNodeState=ANY
Prolog=/opt/v5/slurm/prolog.sh
Epilog=/opt/v5/slurm/epilog.sh
PrologFlags=Alloc

# The only files that differ between the Docker test and Cloud nodes:
#   site.conf  : process tracking and cgroup enforcement (Docker: none; Cloud nodes: cgroup)
#   nodes.conf : node and partition lines;  gres.conf : how GPUs are found;  cgroup.conf
Include /etc/slurm/site.conf
Include /etc/slurm/nodes.conf
