# Inputs for the cost model (ADR 0004). Results are in node-hours: waste, risk and spend are counted as time
# on the GPU nodes, which does not depend on a price. The price is an input with no value in the repo:
# give it at run time (--price-per-node-h or V5_PRICE_PER_NODE_H) to add a cost column in your own currency.
price_per_node_h: null            # input: price of one GPU node for one hour; no value in the repo
spot_price_ratio: null            # input: spot price / on-demand price; the report gives the break-even ratio

instances:
  gpu-node-8:                     # a generic 8-GPU node, the proposed main-run node (ADR 0002 §1)
    gpus: 8
  gpu-node-8-prev:                # a generic 8-GPU node of the previous generation, fallback
    gpus: 8
  gpu-node-4-eval:                # a generic 4-GPU node, eval partition
    gpus: 4
main_instance: gpu-node-8

hardware:                         # per node, assumptions until measured on the week-2 node (ADR 0001 M9)
  gpu_to_host_gbytes_s: 50        # staging the checkpoint shard into pinned host RAM
  upload_gbytes_s: 10             # NVMe -> remote store
  download_gbytes_s: 10           # remote store -> NVMe on restore
  instance_launch_s: 900          # no spare: start a new node and join Slurm (ResumeTimeout)

checkpoint:
  bytes_per_param: 12             # fp32 master weights 4 + AdamW m 4 + v 4 (bf16 weights are rebuilt)
  keep_remote: 3
  protected_per_month: 30         # every N-th checkpoint kept for eval (Team 09 sets N)
